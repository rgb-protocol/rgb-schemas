name: Generate examples

on:
  push:
    branches:
      - master
    tags:
      - '*'
  pull_request:
    branches:
      - master

env:
  CARGO_TERM_COLOR: always

jobs:
  gen-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo run --example nia
      - run: cargo run --example ifa
      - run: cargo run --example cfa
      - run: cargo run --example pfa
      - run: cargo run --example uda
      - run: cargo run --example bfa
      - run: git diff --quiet test/ || exit 1
