[package]
name = "rgb-schemas"
version = "0.11.1"
description = "Collection of the official RGB smart contract schemata"
keywords = ["bitcoin", "lightning", "rgb", "smart-contracts", "lnp-bp"]
categories = ["cryptography::cryptocurrencies"]
authors = ["Zoe Faltibà <zoefaltiba@gmail.com>"]
homepage = "https://rgb.info"
repository = "https://github.com/rgb-protocol/rgb-schemas"
rust-version = "1.85.0"
edition = "2021"
license = "Apache-2.0"

[[bin]]
name = "rgb-schemas"
required-features = ["fs"]

[lib]
name = "schemata"

[dependencies]
amplify = "=4.8.1"
rgb-strict-types = "~1.0.4"
rgb-aluvm = "0.11.1"
rgb-ops = { version = "0.11.1", features = ["fs"] }

[dev-dependencies]
rgb-ops = { version = "0.11.1", features = [
    "fs",
    "serde",
] }
serde_json = "1"
sha2 = "0.11.0"

[features]
default = []
all = [
    "log",
    "fs",
]
log = [
    "rgb-aluvm/log",
]
fs = [
    "rgb-ops/fs",
]
